<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bruce Springsteen: World Tour Manager</title>
<style>
/* Layout concept: a road-case control desk — stencilled case labels, a dark rig, one stage-red accent, and a gaffer-taped paper setlist as the only light surface. */
:root {
  color-scheme: dark;
  --bg: #0e1014;
  --panel: #161a20;
  --panel2: #1c2129;
  --raise: #232a33;
  --line: #2a313b;
  --line2: #38414d;
  --text: #ece6da;
  --muted: #98a0aa;
  --dim: #6c7480;
  --red: #d63a2f;
  --red-dim: #5a1f1b;
  --amber: #e3a63b;
  --green: #56b07f;
  --blue: #6c9be0;
  --paper: #efe8d6;
  --ink: #1d1c1b;
  --tape: #b9ab86;
  --f-display: "Big Shoulders Display", "Oswald", "Arial Narrow", Impact, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-marker: "Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  --r: 6px;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--f-body); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; letter-spacing: .02em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: 34px; } h2 { font-size: 22px; text-transform: uppercase; } h3 { font-size: 16px; text-transform: uppercase; letter-spacing: .06em; }
p { margin: 0; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .red { color: var(--red); } .amber { color: var(--amber); } .green { color: var(--green); }
.small { font-size: 12px; } .tiny { font-size: 11px; }
.nowrap { white-space: nowrap; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px; padding: 18px 16px; overflow-y: auto; }
.brand .eyebrow { font: 600 10px var(--f-mono); letter-spacing: .18em; color: var(--red); text-transform: uppercase; }
.brand h1 { font-size: 30px; text-transform: uppercase; margin-top: 4px; }
.brand .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
.fict { display: inline-block; margin-top: 8px; font: 600 10px var(--f-mono); letter-spacing: .12em; border: 1px dashed var(--amber); color: var(--amber); padding: 3px 6px; border-radius: 3px; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: var(--r); color: var(--muted); cursor: pointer; font-weight: 500; }
.nav button .n { font: 500 11px var(--f-mono); color: var(--dim); width: 18px; }
.nav button:hover { background: var(--panel2); color: var(--text); }
.nav button.on { background: var(--raise); color: var(--text); box-shadow: inset 3px 0 0 var(--red); }
.nav button .badge { margin-left: auto; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
.savestate { font: 11px var(--f-mono); color: var(--dim); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.topbar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.topbar .tb { display: flex; flex-direction: column; min-width: 0; }
.topbar .tb .l { font: 600 10px var(--f-mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.topbar .tb .v { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .grow { flex: 1; }
.screen { flex: 1; overflow-y: auto; padding: 20px 20px 48px; display: flex; flex-direction: column; gap: 18px; }
.screen-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.screen-h .case { font: 600 11px var(--f-mono); letter-spacing: .16em; color: var(--red); text-transform: uppercase; }
.screen-h h1 { text-transform: uppercase; }
.screen-h p { color: var(--muted); max-width: 70ch; margin-top: 4px; }

/* ---------- primitives ---------- */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h3 { display: flex; gap: 8px; align-items: baseline; }
.panel-h h3 .tag { font: 500 10px var(--f-mono); color: var(--dim); letter-spacing: .1em; }
.panel-b { padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 6px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.sp { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r); padding: 7px 12px; cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { background: var(--raise); border-color: var(--muted); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #e2473b; }
.btn.big { padding: 10px 18px; font-size: 15px; font-family: var(--f-display); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--panel2); }
.btn.sm { padding: 4px 8px; font-size: 12px; }
.btn.icon { padding: 3px 7px; font-family: var(--f-mono); font-size: 12px; }
.btn.danger { border-color: var(--red-dim); color: #f08a80; }
.btn.danger.armed { background: var(--red); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
input[type=text], input[type=number], input[type=date], input[type=search], select, textarea { background: var(--bg); border: 1px solid var(--line2); border-radius: var(--r); padding: 6px 9px; min-width: 0; }
textarea { width: 100%; min-height: 120px; font: 12px var(--f-mono); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
label.f > span { font: 600 10px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
label.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 4px; font: 500 11px var(--f-mono); padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; }
.chip.red { border-color: var(--red); color: #f2948b; } .chip.amber { border-color: var(--amber); color: var(--amber); } .chip.green { border-color: var(--green); color: var(--green); } .chip.blue { border-color: var(--blue); color: var(--blue); }
.chip.fill-red { background: var(--red); border-color: var(--red); color: #fff; }
.badge { font: 600 10px var(--f-mono); background: var(--red); color: #fff; border-radius: 99px; padding: 1px 6px; }
.badge.amber { background: var(--amber); color: #1a1408; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.kpi .l { font: 600 10px var(--f-mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.kpi .v { font: 800 28px var(--f-display); margin-top: 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }
.meter { height: 6px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.meter > i { display: block; height: 100%; background: var(--muted); border-radius: 99px; }
.meter.good > i { background: var(--green); } .meter.warn > i { background: var(--amber); } .meter.bad > i { background: var(--red); } .meter.blue > i { background: var(--blue); }
.mrow { display: grid; grid-template-columns: minmax(0, 150px) minmax(0, 1fr) 44px; gap: 10px; align-items: center; font-size: 13px; }
.mrow .val { font: 500 12px var(--f-mono); text-align: right; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th { text-align: left; font: 600 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 6px 8px; border-bottom: 1px solid var(--line2); white-space: nowrap; position: sticky; top: 0; background: var(--panel); }
table.data th.sortable { cursor: pointer; } table.data th.sortable:hover { color: var(--text); }
table.data td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.data td.n, table.data th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
table.data tr.click { cursor: pointer; } table.data tr.click:hover td { background: var(--panel2); }
table.data tr.sel td { background: var(--raise); }
.scroll-x { overflow-x: auto; }
.scroll-y { overflow-y: auto; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center; }
.notice { border: 1px dashed var(--amber); color: #ecd3a3; background: rgba(227,166,59,.06); border-radius: var(--r); padding: 8px 12px; font-size: 12.5px; }
.issue { font-size: 12px; padding: 4px 8px; border-radius: 4px; border-left: 3px solid var(--amber); background: rgba(227,166,59,.07); }
.issue.error { border-color: var(--red); background: rgba(214,58,47,.09); }
.issue.info { border-color: var(--blue); background: rgba(108,155,224,.08); }
.pos { color: var(--green); } .neg { color: #f08a80; }
.divider { height: 1px; background: var(--line); }

/* ---------- overview ---------- */
.laminate { position: relative; background: linear-gradient(160deg, var(--raise), var(--panel2)); border: 1px solid var(--line2); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.laminate::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--red) 0 22px, transparent 22px 30px); opacity: .85; }
.laminate .pass { font: 600 10px var(--f-mono); letter-spacing: .2em; color: var(--red); }
.laminate .city { font: 800 40px var(--f-display); text-transform: uppercase; line-height: 1; }
.checklist { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.checklist .ck { display: flex; gap: 8px; align-items: baseline; }
.checklist .ck b { font: 700 11px var(--f-mono); width: 30px; }
.news { display: flex; flex-direction: column; }
.news .it { padding: 8px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; }
.news .it:last-child { border: 0; }
.news .d { font: 11px var(--f-mono); color: var(--dim); padding-top: 2px; }
.news .t { font-weight: 600; } .news .x { color: var(--muted); font-size: 13px; }
.news .it.good .t { color: var(--green); } .news .it.bad .t { color: #f08a80; } .news .it.event .t { color: var(--amber); }

/* ---------- map ---------- */
.mapwrap { position: relative; background: #0b0d10; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
.mapwrap canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.map-legend { position: absolute; left: 10px; bottom: 8px; display: flex; gap: 10px; flex-wrap: wrap; font: 11px var(--f-mono); color: var(--muted); background: rgba(11,13,16,.75); padding: 4px 8px; border-radius: 4px; }
.map-legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: var(--r); overflow: hidden; flex-wrap: wrap; }
.seg button { background: none; border: 0; padding: 5px 10px; cursor: pointer; color: var(--muted); font-size: 12px; border-right: 1px solid var(--line2); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--raise); color: var(--text); }

/* ---------- planner ---------- */
.plan-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.vlist { display: flex; flex-direction: column; gap: 8px; max-height: 760px; overflow-y: auto; padding-right: 2px; }
.vcard { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; background: var(--panel2); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; }
.vcard .vn { font-weight: 600; } .vcard .vc { font-size: 12px; color: var(--muted); }
.vcard .vs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; font-size: 11.5px; }
.vcard .vs div { display: flex; flex-direction: column; } .vcard .vs b { font: 500 12px var(--f-mono); color: var(--text); } .vcard .vs span { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; }
.mixbar { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 99px; overflow: hidden; }
.mixbar i:first-child { background: var(--blue); } .mixbar i:last-child { background: var(--red); }
.itin { display: flex; flex-direction: column; }
.leg-h { display: flex; align-items: center; gap: 10px; padding: 10px 0 6px; font: 700 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--amber); }
.leg-h::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
.trav { font: 11px var(--f-mono); color: var(--dim); padding: 2px 0 2px 92px; }
.trav.inter { color: var(--blue); }
.irow { display: grid; grid-template-columns: 84px minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel2); }
.irow.played { opacity: .62; }
.irow.nonshow { background: transparent; border-style: dashed; }
.irow.next { border-color: var(--red); }
.irow .dt { font: 600 12px var(--f-mono); } .irow .dt span { display: block; color: var(--dim); font-weight: 400; }
.irow .ti { font-weight: 600; } .irow .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.irow .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.irow .iss { grid-column: 2 / -1; display: flex; flex-direction: column; gap: 4px; }

/* ---------- calendar ---------- */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font: 600 10px var(--f-mono); letter-spacing: .12em; color: var(--dim); text-align: center; padding: 4px 0; }
.cal .day { min-height: 96px; background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 5px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; text-align: left; min-width: 0; }
.cal .day:hover { border-color: var(--muted); }
.cal .day.out { opacity: .35; }
.cal .day.today { box-shadow: inset 0 0 0 2px var(--amber); }
.cal .day.past { background: var(--panel); }
.cal .day .dn { font: 600 11px var(--f-mono); color: var(--dim); }
.cal .ev { font-size: 11px; padding: 2px 5px; border-radius: 3px; background: var(--raise); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--muted); }
.cal .ev.show { border-color: var(--red); color: var(--text); font-weight: 600; }
.cal .ev.show.done { border-color: var(--green); }
.cal .ev.rest { border-color: var(--green); } .cal .ev.rehearsal { border-color: var(--blue); } .cal .ev.production { border-color: var(--amber); } .cal .ev.promo { border-color: #b48ad6; }
.cal .ev.err { background: rgba(214,58,47,.25); }

/* ---------- setlist workshop ---------- */
.ws { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) minmax(0, .95fr); gap: 16px; align-items: start; }
.lib { display: flex; flex-direction: column; max-height: 780px; overflow-y: auto; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 7px 4px; border-bottom: 1px solid var(--line); align-items: center; }
.lrow[draggable=true] { cursor: grab; }
.lrow .lt { font-weight: 500; cursor: pointer; } .lrow .lt:hover { color: var(--amber); }
.lrow .lm { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--dim); align-items: center; }
.lrow.in .lt { color: var(--dim); }
.en { display: inline-flex; gap: 1px; vertical-align: middle; }
.en i { width: 3px; height: 9px; background: var(--line2); border-radius: 1px; }
.en i.on { background: var(--red); }
.run { display: flex; flex-direction: column; gap: 3px; min-height: 120px; }
.sec-h { font: 800 13px var(--f-display); letter-spacing: .14em; text-transform: uppercase; padding: 10px 0 4px; display: flex; justify-content: space-between; color: var(--muted); }
.sec-h.encore { color: var(--red); } .sec-h.acoustic { color: var(--blue); }
.srow { display: grid; grid-template-columns: 20px 26px minmax(0, 1fr) auto; gap: 6px; align-items: center; padding: 5px 6px; border: 1px solid var(--line); background: var(--panel2); border-radius: 4px; }
.srow.drag-over { border-color: var(--amber); box-shadow: 0 -2px 0 var(--amber); }
.srow.dragging { opacity: .4; }
.srow .h { cursor: grab; color: var(--dim); font-family: var(--f-mono); user-select: none; text-align: center; }
.srow .no { font: 600 12px var(--f-mono); color: var(--dim); text-align: right; }
.srow .tt { min-width: 0; } .srow .tt b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.srow .tt span { font-size: 11px; color: var(--dim); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.srow .ra { display: flex; gap: 3px; align-items: center; }
.srow select { padding: 2px 4px; font-size: 11px; }
.dropzone { border: 1px dashed var(--line2); border-radius: 4px; padding: 10px; text-align: center; color: var(--dim); font-size: 12px; }
.dropzone.drag-over { border-color: var(--amber); color: var(--amber); }
.bigdur { font: 800 44px var(--f-display); line-height: 1; font-variant-numeric: tabular-nums; }
.albars { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.albars .ab { display: grid; grid-template-columns: minmax(0, 1fr) 90px 22px; gap: 6px; align-items: center; }
.albars .ab span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { fill: var(--muted); font: 12px var(--f-mono); }

/* taped paper setlist — the one light surface */
.sheet-wrap { padding: 18px 8px; display: flex; justify-content: center; }
.sheet { position: relative; background: var(--paper); color: var(--ink); width: min(420px, 100%); padding: 34px 28px 30px; box-shadow: 0 14px 30px rgba(0,0,0,.5); transform: rotate(-.6deg); font-family: var(--f-marker); }
.sheet::before, .sheet::after { content: ""; position: absolute; top: -12px; width: 96px; height: 28px; background: var(--tape); opacity: .9; }
.sheet::before { left: 18px; transform: rotate(-4deg); } .sheet::after { right: 18px; transform: rotate(5deg); }
.sheet .hd { font-size: 15px; text-align: center; border-bottom: 2px solid var(--ink); padding-bottom: 6px; margin-bottom: 10px; line-height: 1.3; }
.sheet ol { margin: 0; padding-left: 30px; font-size: 19px; line-height: 1.32; }
.sheet ol li::marker { font-size: 14px; }
.sheet .sx { font-size: 15px; letter-spacing: .1em; margin: 10px 0 4px; text-decoration: underline; }
.sheet .sx.enc { color: #a3261d; }

/* ---------- modal & toast ---------- */
#modal-root:empty { display: none; }
.overlay { position: fixed; inset: 0; background: rgba(5,6,8,.72); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; width: min(640px, 100%); box-shadow: 0 24px 60px rgba(0,0,0,.6); }
.modal.wide { width: min(980px, 100%); }
.modal-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.modal-h .k { font: 600 10px var(--f-mono); letter-spacing: .16em; color: var(--red); text-transform: uppercase; }
.modal-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.opt { display: flex; flex-direction: column; gap: 3px; text-align: left; background: var(--panel2); border: 1px solid var(--line2); border-radius: var(--r); padding: 10px 12px; cursor: pointer; }
.opt:hover { border-color: var(--amber); background: var(--raise); }
.opt b { font-size: 14px; } .opt span { font-size: 12.5px; color: var(--muted); }
#toast { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

/* =====================================================================
   GREY THEME — Chalet 1960 typography, a quiet grey palette, white text.
   Chalet is a licensed House Industries typeface: it is used when it is
   installed on the viewer's computer; otherwise Helvetica Neue / Helvetica
   (the closest common match to Chalet 1960) and then Arial take over.
   Status colours (red / amber / green) remain only where they carry meaning.
   ===================================================================== */
:root {
  --chalet: "Chalet 1960", "Chalet London 1960", "ChaletLondon1960", "Chalet London", "Chalet", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --dim: #a1a1a7;
  --red: #e5574c;

  --amber: #e2b45c;
  --green: #6cc391;
  --blue: #8fb3e8;
  --f-display: var(--chalet);
  --f-body: var(--chalet);
  --f-mono: var(--chalet);
  --f-marker: var(--chalet);
}
body { background: var(--bg); font-family: var(--chalet); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--chalet); font-weight: 700; letter-spacing: 0; }
h2 { letter-spacing: .01em; } h3 { letter-spacing: .04em; }
.mono, .num, table, .topbar .tb .v { font-variant-numeric: tabular-nums; }
/* top-left: no logo — just the tour name and its status, small */

.fict { border-style: solid; border-color: var(--line2); color: var(--muted); letter-spacing: .06em; }
/* navigation and selections: white, not colour */
.nav button { color: var(--muted); }
.nav button:hover { color: var(--text); }
.nav button.on { background: var(--raise); color: var(--text); box-shadow: inset 3px 0 0 var(--text); font-weight: 600; }

.btn.primary:disabled { background: var(--raise); border-color: var(--line2); color: var(--dim); }

:focus-visible { outline-color: var(--text); }

/* State / province of a venue, from its own address ("East Rutherford, NJ"), falling back to its market city. */
function venueState(v) {
  const c = CITY[v.city];

/* Every filter key a venue belongs to. Keys: us:<region>, us-st:<state>, ca:<group>, ca-pr:<province>, mx-st:<state>, mx-metro:<cityId>. */
function venueNAKeys(v) {
  return memo("nakeys:" + v.id, () => {
    const c = CITY[v.city], st = venueState(v), keys = [];
    if (c.c === "US") { if (US_STATE_REGION[st]) keys.push("us:" + US_STATE_REGION[st]); if (st) keys.push("us-st:" + st); }
    else if (c.c === "CA") { if (CA_PROV_GROUP[st]) keys.push("ca:" + CA_PROV_GROUP[st]); if (st) keys.push("ca-pr:" + st); }
    else if (c.c === "MX") { if (st) keys.push("mx-st:" + st); keys.push("mx-metro:" + c.id); }
    return keys;
  });
}

}
function naKeyDetail(k) {
  const [t, x] = k.split(":");
  return t === "us" ? US_REGIONS[x].states.filter(s => s !== "HI").map(s => US_STATE_NAMES[s]).join(", ") + (x === "pacific" ? " (and Hawaii)" : "")

}
/* Options for the picker, each with how many venues it contains. */
function naFilterGroups() {
  return memo("nagroups", () => {
    const count = {}; VENUES.forEach(v => venueNAKeys(v).forEach(k => count[k] = (count[k] || 0) + 1));
    const o = k => ({ key: k, label: naKeyLabel(k), detail: naKeyDetail(k), count: count[k] || 0 });
    const mxStates = Object.keys(MX_STATES).map(s => o("mx-st:" + s)).sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
    const mxMetros = CITIES.filter(c => c.c === "MX").map(c => o("mx-metro:" + c.id));
    return [
      { id: "us", n: "United States", opts: Object.keys(US_REGIONS).map(k => o("us:" + k)) },
      { id: "ca", n: "Canada — regions", opts: Object.keys(CA_GROUPS).map(k => o("ca:" + k)) },
      { id: "ca-pr", n: "Canada — provinces & territories", opts: Object.keys(CA_PROVINCES).map(p => o("ca-pr:" + p)) },

}

function matchNA(v, keys) {
  if (!keys || !keys.length) return true;
  const vk = venueNAKeys(v);
  return keys.some(k => vk.includes(k));
}

const STATE_NAMES = { AZ: "Arizona", CA: "California", CO: "Colorado", CT: "Connecticut", DC: "District of Columbia", FL: "Florida", GA: "Georgia", IL: "Illinois", MA: "Massachusetts", MD: "Maryland",

function stateName(c) { if (c.c === "AU" && c.st === "WA") return STATE_NAMES.WA_AU; if (c.c === "AU" && c.st === "SA") return STATE_NAMES.SA; return c.st.split(" / ").map(x => STATE_NAMES[x] || x).join(" "); }

/* ---------- the shared venue filter (planner list, single & bulk booking) ---------- */
/* f: { q, region, country, cat, minCap, maxCap, city, na: [keys], date, avail: "any"|"bookable"|"available" } */
function venueFilterDefaults() { return { q: "", region: "all", country: "all", cat: "all", minCap: 0, maxCap: 0, city: "", na: [], date: "", avail: "any" }; }
function venueDateOK(v, f) {
  if (!f.date || !parseDate(f.date) || f.avail === "any") return true;
  if (v.avail === "unavailable" || isFestOnly(v)) return false;
  if (S.items.some(x => x.date === f.date && !x.played)) return false;   /* the tour is already busy that day */
  const st = venueDateStatus(v, f.date);
  return f.avail === "available" ? st.status === "available" : st.status !== "unavailable";
}
function venueMatches(v, f) {
  const c = CITY[v.city], co = COUNTRIES[c.c], q = qNorm(f.q);
  if (f.city && v.city !== f.city) return false;
  if (f.na && f.na.length) { if (!NA_COUNTRIES.includes(c.c) || !matchNA(v, f.na)) return false; }
  else if (f.region && f.region !== "all" && co.r !== f.region) return false;
  if (f.country && f.country !== "all" && c.c !== f.country) return false;
  if (f.cat && f.cat !== "all" && v.cat !== f.cat) return false;
  if (f.minCap && v.cap < f.minCap) return false;
  if (f.maxCap && v.cap > f.maxCap) return false;

function lineChart(series, opt) {

    ${sh.played ? `<div class="row tight">${chip("Performance " + R.perf)}${chip(num(R.sold) + " / " + num(R.cap))}${chip("Net " + money(R.fin.net), R.fin.net >= 0 ? "green" : "red")}</div>` : P ? `<div class="row tight">${chip("Proj. " + num(P.sold) + " sold")}${chip("Proj. net " + money(P.fin.net), P.fin.net >= 0 ? "green" : "red")}${chip("Proj. performance " + P.perf)}</div>` : ""}

/* ---------- song info ---------- */
function compatible(s) {
  return SONGS.filter(x => x.id !== s.id).map(x => {
    let sc = 10 - Math.abs(x.en - s.en) * 2 + (x.mood === s.mood ? 4 : 0) + (x.al === s.al ? 2 : 0) + (PAIRINGS.some(([a, b]) => (a === s.t && b === x.t) || (b === s.t && a === x.t)) ? 12 : 0) + x.fam / 25;
    return { x, sc };
  }).sort((a, b) => b.sc - a.sc).slice(0, 6).map(o => o.x);
}

      <td class="small">${[s.fl.includes("o") && "open", s.fl.includes("c") && "close", s.fl.includes("e") && "encore", s.fl.includes("f") && "finale", s.fl.includes("p") && "political"].filter(Boolean).join(", ") || "mid"}</td><td class="n">${o ? o.plays : 0}</td><td class="small mono">${o ? fmtD(o.lastDate, { year: undefined }) : "—"}</td><td class="small">${rotationClass(s.id, H)}</td>

/* ---------- finance ---------- */
function renderPL(sh) {
  if (!sh) return `<div class="empty">Select a concert in the table.</div>`;
  const v = VENUE[sh.venueId]; if (!v) return `<div class="empty">This concert has no venue booked.</div>`;
  const played = sh.played, act = played ? sh.report.fin : null, proj = played ? sh.report.proj : (projectAll()[sh.id] || {}).fin;
  if (!proj && !act) return `<div class="empty">No projection available (check the date).</div>`;
  const keys = [], label = {}, pv = {}, av = {};
  ["rev", "exp"].forEach(side => { [proj, act].forEach((F, j) => F && F[side].forEach(l => { const k = side + ":" + l.k; if (!keys.includes(k)) keys.push(k); label[k] = l.label; (j ? av : pv)[k] = l.v; })); });
  const row = k => { const p = pv[k], a = av[k], isExp = k.startsWith("exp"); const varc = played && p != null && a != null ? (isExp ? p - a : a - p) : null;

  const c = venueCountry(v);

}
function renderFinance() {

  ps.forEach(s => { const lsum = ledByShow(s.date).reduce((a, l) => a + l.amount, 0); cash = S.startBudget + ps.filter(x => x.date <= s.date).reduce((a, x) => a + x.report.fin.net, 0) + lsum; cashLine.push(cash); labels.push(s.date.slice(5)); });
  const projLine = cashLine.map(() => null); projLine[projLine.length - 1] = S.cash; let pc = S.cash;
  all.filter(s => !s.played && P[s.id]).forEach(s => { pc += P[s.id].fin.net; projLine.push(pc); labels.push(s.date.slice(5)); });
  const bars = all.map(s => ({ l: showName(s) + " " + s.date, short: s.date.slice(5), v: s.played ? s.report.fin.net : null, p: s.played ? (s.report.proj ? s.report.proj.net : null) : P[s.id] ? P[s.id].fin.net : null }));

        ${all.map(s => { const p = s.played ? s.report.proj : P[s.id] && P[s.id].fin, a = s.played ? s.report.fin : null, F = a || p; return `<tr class="click ${ui.finSel === s.id ? "sel" : ""}" data-act="finSel" data-arg="${s.id}"><td class="mono small nowrap">${s.date.slice(5)}</td><td>${esc(showName(s))}</td><td class="n">${money(s.price, true)}</td><td class="n">${F ? num(F.sold) : "—"}${s.played ? "" : "*"}</td><td class="n">${F ? money(F.revenue) : "—"}</td><td class="n">${F ? money(F.expenses) : "—"}</td><td class="n ${p ? cls(p.net) : ""}">${p ? money(p.net) : "—"}</td><td class="n ${a ? cls(a.net) : ""}">${a ? money(a.net) : ""}</td><td class="n ${a && p ? cls(a.net - p.net) : ""}">${a && p ? sgn(Math.round((a.net - p.net) / 1000)) + "k" : ""}</td></tr>`; }).join("")}
      </tbody></table><div class="tiny dim">* projected</div>

/* ---------- stats ---------- */
function renderStats() {

  const mx = freq[0] ? freq[0].o.plays : 1;
  const classes = {}; freq.forEach(f => { const c = rotationClass(f.id, H); classes[c] = (classes[c] || 0) + 1; });
  const openers = {}, closers = {}; ps.forEach(p => { const sl = p.report.setlist; if (sl[0]) openers[sl[0].s] = (openers[sl[0].s] || 0) + 1; if (sl.length) closers[sl[sl.length - 1].s] = (closers[sl[sl.length - 1].s] || 0) + 1; });
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id, c]) => `<div class="row tight"><span class="sp">${esc(SONG[id] ? SONG[id].t : id)}</span><span class="mono">${c}</span></div>`).join("");
  const consec = freq.filter(f => f.o.consec > 0).sort((a, b) => b.o.consec - a.o.consec);
  const absent = freq.filter(f => H.n - 1 - f.o.last >= 5).sort((a, b) => (b.o.plays) - (a.o.plays)).slice(0, 12);
  const debuts = freq.filter(f => f.o.first > 0).sort((a, b) => a.o.firstDate.localeCompare(b.o.firstDate));
  const alb = {}; ps.forEach(p => p.report.setlist.forEach(e => { const s = SONG[e.s]; if (s) alb[s.al] = (alb[s.al] || 0) + 1; }));
  const albs = Object.entries(alb).sort((a, b) => b[1] - a[1]), amx = albs.length ? albs[0][1] : 1;
  const legs = computeLegs(), legVar = {}; ps.forEach((p, i) => { if (!i) return; const l = legs[p.id]; (legVar[l] = legVar[l] || []).push(p.report.variation); });
  const reg = {}; ps.forEach(p => { const r = reg[p.report.region] || (reg[p.report.region] = { n: 0, att: 0, cap: 0, net: 0 }); r.n++; r.att += p.report.sold; r.cap += p.report.cap; r.net += p.report.fin.net; });
  return `${screenHead("09", "Tour History & Statistics", "Everything here comes from shows played in this campaign. Counts are fictional campaign statistics, not historical Springsteen play counts.")}
    <div class="row">${Object.entries(classes).map(([c, n]) => chip(`${c}: ${n}`, c === "Staple" ? "red" : c === "Rarity" ? "amber" : "")).join("")}${chip(freq.length + " different songs")}${chip(ps.length + " shows")}</div>
    <div class="grid g2">
      <div class="panel"><div class="panel-h"><h3>Song frequency</h3></div><div class="panel-b scroll-y" style="max-height:520px" data-keep="freq">
        <div class="albars">${freq.slice(0, 40).map(f => `<div class="ab" style="grid-template-columns:minmax(0,1fr) 110px 26px"><span data-act="songInfo" data-arg="${f.id}" style="cursor:pointer">${esc(f.s.t)} <span class="dim tiny">${rotationClass(f.id, H)}</span></span>${meter(f.o.plays, mx, f.o.plays / H.n >= .75 ? "bad" : "")}<span class="mono">${f.o.plays}</span></div>`).join("")}</div></div></div>
      <div class="panel"><div class="panel-h"><h3>Album representation</h3><span class="tiny dim mono">TOTAL PERFORMANCES</span></div><div class="panel-b"><div class="albars">${albs.map(([a, c]) => `<div class="ab"><span>${esc(albumShort(a))}</span>${meter(c, amx, "")}<span class="mono">${c}</span></div>`).join("")}</div></div></div>
    </div>
    <div class="grid g3">
      <div class="panel"><div class="panel-h"><h3>Openers</h3></div><div class="panel-b small">${top(openers)}</div></div>
      <div class="panel"><div class="panel-h"><h3>Closers</h3></div><div class="panel-b small">${top(closers)}</div></div>
      <div class="panel"><div class="panel-h"><h3>Consecutive-night repeats</h3></div><div class="panel-b small">${consec.length ? consec.slice(0, 8).map(f => `<div class="row tight"><span class="sp">${esc(f.s.t)}</span><span class="mono">${f.o.consec}</span></div>`).join("") : '<span class="muted">No songs repeated on back-to-back nights.</span>'}</div></div>

/* ---------- wiring ---------- */
function moveEntry(from, to, secFromTarget) {
  const sh = currentShow(); if (!editable(sh)) return;
  const sl = sh.setlist, e = sl.splice(from, 1)[0]; if (!e) return;
  if (to > from) to--;
  if (secFromTarget && sl[to]) e.sec = sl[to].sec;
  sl.splice(clamp(to, 0, sl.length), 0, e); normalizeSetlist(sh); persist(); render();
}
function boot() {

    const fn = ACT[t.dataset.act]; if (fn) fn(t.dataset.arg, t, e);

  document.addEventListener("keydown", e => { if (e.key === "Escape" && !(S && S.pendingEvent) && $("#modal-root").innerHTML) { ui.confirm = null; closeModal(); } });
  document.addEventListener("dragstart", e => {

    ui.drag = r.dataset.dragIdx != null ? { idx: +r.dataset.dragIdx } : { song: r.dataset.dragSong };

/* ---------- availability strip (single & festival booking) ---------- */

/* =====================================================================
   UI for the balance update: demand → tickets → attendance → capacity,
   catchment zones, and the simulation-balance settings.
   ===================================================================== */
const ZONE_LABEL = { local: "Local (≤1 h)", regional: "Regional (1–3 h)", extended: "Extended domestic", international: "International" };

/* d: { demand, sold, attendance, cap, zones, origins, projected, u } */
function demandBlock(d, opts) {

  const soldTxt = d.projected ? (lo === hi ? num(hi) : `${num(lo)}–${num(hi)}`) : num(d.sold);
  const att = d.attendance != null ? d.attendance : Math.round((d.projected ? Math.min(d.cap, d.demand) : d.sold) * .97);
  const ratio = d.cap ? d.demand / d.cap : 0;
  const read = ratio >= 1.15 ? "Demand comfortably exceeds capacity" : ratio >= 1 ? "Demand is about equal to capacity" : ratio >= .8 ? "Demand is a little below capacity" : "Demand is well below capacity";
  const cells = [
    ["Ticket demand", num(d.demand), d.projected ? "people trying to buy" : "people who tried to buy"],
    [d.projected ? "Tickets sold (forecast)" : "Tickets sold", soldTxt, d.projected ? `±${Math.round(u * 100)}% forecast range` : pct(d.sold / d.cap) + " of capacity"],
    [d.projected ? "Attendance (est.)" : "Attendance", num(att), "ticket holders through the door"],
    ["Capacity", num(d.cap), "game estimate"]

  return `<div class="panel"><div class="panel-h"><h3>Plan a rehearsal block</h3><span class="tag">≈${money(cost)} · ROOM FOR ≈${cap} SONG RUN-THROUGHS</span></div><div class="panel-b stack">
    <div class="form-grid">
      <label class="f"><span>Location</span><select data-ch="rehF" data-arg="loc">${Object.entries(REH_LOCS).map(([k, L]) => opt(k, `${L.n} — ${money(L.cost)}/day`, f.loc)).join("")}</select></label>
      <label class="f"><span>First day</span><input type="date" data-ch="rehF" data-arg="start" value="${f.start}" min="${addDays(S.today, 1)}"></label>
      <label class="f"><span>Days</span><input type="number" data-ch="rehF" data-arg="days" min="1" max="21" value="${f.days}"></label>

    <div><div class="tiny dim mono">FOCUS</div><div class="row tight">${Object.entries(REH_FOCUS).filter(([k]) => k !== "album" || fullAlbumAllowed()).map(([k, l]) => `<label class="chk small"><input type="checkbox" data-ch="rehFocus" data-arg="${k}" ${f.focus.includes(k) ? "checked" : ""}>${esc(l)}</label>`).join("")}</div></div>
    <div><div class="tiny dim mono">MUSICIANS</div><div class="row tight">${eraLineup().map(m => `<label class="chk small"><input type="checkbox" data-ch="rehMus" data-arg="${esc(m)}" ${f.musicians.includes(m) ? "checked" : ""}>${esc(m)}</label>`).join("")}</div>
      ${gs.length ? `<div class="row tight">${gs.map(g => `<label class="chk small" title="${esc(g.note)}"><input type="checkbox" data-ch="rehGuest" data-arg="${g.id}" ${f.guests.includes(g.id) ? "checked" : ""}>${esc(g.n)} (guest)</label>`).join("")}</div><div class="tiny dim">A guest who rehearses with the band is more likely to accept an invitation later.</div>` : ""}</div>
    <div><div class="tiny dim mono">SONGS (${f.songs.length})</div>
      <div class="row tight">${groups.filter(g => g[2]).map(([k, l]) => `<button class="btn sm" data-act="rehAddGroup" data-arg="${k}">+ ${esc(l)}</button>`).join("")}

    ${f.songs.length ? `<table class="data"><thead><tr><th>Song</th><th class="n">Ready</th><th>Arrangement</th><th></th></tr></thead><tbody>${f.songs.map(rehSongRow).join("")}</tbody></table>` : `<div class="empty small">No songs chosen yet.</div>`}
    <div class="tiny dim">Readiness (0–100, game estimate) rises with rehearsal, sound checks and performances. More songs than the block has room for means less progress on each, and some may be set aside. Rehearsing a song never adds it to a setlist.</div>
    <div class="row"><div class="sp"></div><button class="btn" data-act="rehClear">Clear</button><button class="btn primary" data-act="rehSubmit">Schedule rehearsals</button></div>
  </div></div>`;
}
function renderRehSessions() {
  const l = S.rehearsals.slice().reverse();
  return `<div class="panel"><div class="panel-h"><h3>Rehearsal blocks</h3></div><div class="panel-b stack">${l.length ? l.map(r => {
    const L = REH_LOCS[r.loc], leak = S.leaks.find(k => k.kind === "rehearsal" && k.date === r.doneOn);
    return `<div class="reh"><div class="row tight"><b>${esc(L.n)}</b><span class="muted small">${fmtD(r.start, { year: undefined })} – ${fmtD(addDays(r.start, r.days - 1))} · ${r.days} day${r.days > 1 ? "s" : ""} · ${money(r.cost)}</span><span class="sp"></span>${r.done ? chip("Done", "green") : r.started ? chip("Under way", "amber") : `${chip("Planned")}<button class="btn sm danger" data-act="rehCancel" data-arg="${r.id}">Cancel</button>`}</div>
      ${r.focus.length ? `<div class="tiny dim">Focus: ${r.focus.map(x => REH_FOCUS[x]).join(", ")}</div>` : ""}
      <div class="tiny dim">Musicians: ${esc(r.musicians.join(", "))}${r.guests.length ? " · guests: " + esc(r.guests.map(id => GUEST[id].n).join(", ")) : ""}</div>
      <div class="small">${r.songs.map(x => `<span class="chip ${x.status === "abandoned" ? "red" : x.status === "ready" ? "green" : ""}" title="${esc((REH_ARR[x.arr] || "") + (x.why ? " — " + x.why : "") + (x.after != null ? ` · readiness ${x.before} → ${x.after}` : ""))}">${esc(SONG[x.s] ? SONG[x.s].t : x.s)}${x.arr !== "band" ? " · " + esc(REH_ARR[x.arr]) : ""}${x.status === "abandoned" ? " · set aside" : ""}</span>`).join(" ")}</div>
      ${leak ? `<div class="issue">Leaked via ${esc(leak.source)}: ${esc(leak.claim)} ${truthChip(leak.truth)}</div>` : ""}</div>`;
  }).join("") : `<div class="empty small">No rehearsals planned. Single rehearsal days can also be added from the calendar.</div>`}</div></div>`;
}
function renderScPlanner() {
  const up = shows().filter(s => !s.played).slice(0, 6);
  if (!up.length) return "";
  if (!ui.scSel || !up.some(s => s.id === ui.scSel)) ui.scSel = up[0].id;
  const sh = itemById(ui.scSel), chosen = sh.sc && sh.sc.songs && sh.sc.songs.length ? sh.sc.songs : null, list = chosen || autoSoundcheck(sh);
  const q = ui.scQ.trim().toLowerCase();
  const res = q.length >= 2 ? SONGS.filter(s => s.t.toLowerCase().includes(q) && !list.includes(s.id)).slice(0, 8) : [];
  return `<div class="panel"><div class="panel-h"><h3>Sound check</h3><select data-ch="scSel" aria-label="Show">${up.map(s => opt(s.id, fmtD(s.date, { year: undefined }) + " · " + showName(s), ui.scSel)).join("")}</select></div><div class="panel-b stack">
    <div class="small muted">Run before every show: monitors, vocal mics, instruments, the room and the mix get checked by playing a few songs. These are tracked separately from the concert setlist. More songs catch more technical problems.</div>
    <div class="row tight">${list.map(id => `<span class="chip ${sh.setlist.some(e => e.s === id) ? "" : "blue"}">${esc(SONG[id].t)}${chosen && arrangementOptions(SONG[id]).length > 1 ? ` <select data-ch="scArr" data-arg="${sh.id}:${id}" aria-label="Arrangement" style="padding:0 2px;font-size:11px">${arrangementOptions(SONG[id]).map(k => opt(k, ARRANGEMENTS[k], (sh.sc.arr || {})[id] || "band")).join("")}</select>` : ""}${chosen ? ` <button class="btn icon" data-act="scRm" data-arg="${sh.id}:${id}" title="Remove" style="padding:0 4px">✕</button>` : ""}</span>`).join(" ")}${chosen ? "" : chip("Automatic", "amber")}</div>
    <div class="tiny dim">Blue songs aren't in tonight's set${S.cfg.liveChanges === "on" ? "; one that sounds great at the sound check can make it into the show" : " and won't be added to it"}.</div>
    <div class="row tight"><input type="search" placeholder="Add a song" value="${esc(ui.scQ)}" data-in="scQ" id="sc-q">${chosen ? `<button class="btn sm" data-act="scAuto" data-arg="${sh.id}">Use automatic</button>` : `<button class="btn sm" data-act="scKeep" data-arg="${sh.id}">Edit this list</button>`}</div>
    <div class="row tight" id="sc-res">${res.map(s => songAllowedFor(s, sh) ? `<button class="btn sm" data-act="scAdd" data-arg="${sh.id}:${s.id}">+ ${esc(s.t)}</button>` : `<span class="chip amber">${esc(s.t)}: not yet</span>`).join(" ")}</div>
  </div></div>`;
}
function renderScLog() {
  const ps = playedShows().filter(s => s.report.soundcheck).slice(-12).reverse();
  return `<div class="panel"><div class="panel-h"><h3>Sound-check log</h3></div><div class="panel-b scroll-y" style="max-height:520px">${ps.length ? `<table class="data"><tbody>${ps.map(s => { const c = s.report.soundcheck; return `<tr><td class="mono small nowrap">${s.date.slice(5)}</td><td class="small"><b>${esc(s.report.city)}</b><div>${c.songs.map(id => esc(SONG[id] ? SONG[id].t : id)).join(", ")}</div>
      ${c.issues.map(x => `<div class="issue ${x.found ? "info" : "error"}">${esc(x.text)}</div>`).join("")}${(s.report.changes || []).filter(x => x.kind === "added" || x.kind === "dropped").map(x => `<div class="issue">${esc(SONG[x.s].t)} ${x.kind === "added" ? "added to" : "dropped from"} the show: ${esc(x.why)}</div>`).join("")}${c.leak ? `<div class="issue">Leaked via ${esc(c.leak.source)}.</div>` : ""}</td></tr>`; }).join("")}</tbody></table>` : `<div class="empty small">Sound checks are logged after each show.</div>`}</div></div>`;
}
function renderRehearsals() {
  const nx = nextShow();
  const weak = nx ? nx.setlist.map(e => e.s).filter(id => SONG[id]).sort((a, b) => readiness(a) - readiness(b)).slice(0, 8) : [];
  return `${screenHead("11", "Rehearsals & Sound Checks", "Work songs up before they're needed. What the band rehearses, what it sound-checks and what it plays are three separate lists. Readiness and effects are game estimates.")}
    <div class="notice" style="max-width:none"><label class="chk"><input type="checkbox" data-ch="liveChanges" ${S.cfg.liveChanges === "on" ? "checked" : ""} ${histAccurate() ? "disabled" : ""}>Allow on-the-night setlist changes</label> — ${S.cfg.liveChanges === "on" && !histAccurate() ? "the band may add a song that sounded great at sound check, drop one that sounded rough, swap an under-rehearsed song for a familiar one, or slip in a local cover. Every change is listed in the concert report." : "off: every concert plays exactly the setlist you finalized. Sound checks still run and can still catch technical problems."}</div>
    ${histAccurate() ? `<div class="notice">Historical accuracy mode: rehearsals and sound checks are management choices and are simulated, but they never leak, never cause on-the-night setlist changes and never produce fictional technical failures.</div>` : ""}
    <div class="grid g2" style="align-items:start">
      <div class="stack" style="gap:18px">${renderRehForm()}</div>
      <div class="stack" style="gap:18px">
        ${nx ? `<div class="panel"><div class="panel-h"><h3>Least-prepared songs in the next set</h3><span class="tag">${esc(showName(nx))} · ${fmtD(nx.date, { year: undefined })}</span></div><div class="panel-b stack">${weak.length ? weak.map(id => mrow(SONG[id].t, readiness(id), goodBad(readiness(id)))).join("") : `<div class="empty small">No setlist yet.</div>`}<div class="tiny dim">Songs under 40 cost a little performance and can be swapped on the night; a well-drilled set (average 80+) adds confidence.</div></div></div>` : ""}
        ${renderScPlanner()}
      </div>
    </div>
    <div class="grid g2" style="align-items:start">${renderRehSessions()}${renderScLog()}</div>`;

/* ---------- guests in the workshop ---------- */
function guestOddsLabel(x, sh) { const o = guestOdds(x, sh); return `${x.n}${x.custom ? " (custom)" : ""} — ${o.p === 0 ? "unavailable" : o.p >= .7 ? "likely" : o.p >= .4 ? "possible" : "unlikely"} (${o.why.toLowerCase().replace(/\.$/, "")})`; }
function renderGuestEntry(sh, x) {
  const g = GUEST[x.id]; if (!g) return "";
  const k = sh.id + "|" + x.id;
  if (x.status !== "confirmed") return `<div class="issue">${esc(g.n)} ${x.status === "declined" ? "said no: " + esc(x.why || "not available") : "cancelled"}. <button class="btn sm" data-act="guestRm" data-arg="${k}">Dismiss</button></div>`;
  const setIds = sh.setlist.map(e => e.s), free = setIds.filter(id => !x.songs.some(y => y.s === id));
  return `<div class="gcard"><div class="row tight"><b>${esc(g.n)}</b>${chip("Confirmed", "green")}${chip(x.mode === "surprise" ? "Surprise" : "Announced", x.mode === "surprise" ? "amber" : "")}${x.override ? chip("Availability set by you", "blue") : ""}${x.leaked ? chip("Leaked", "amber") : ""}${g.custom ? chip("Custom guest · fictional", "amber") : ""}<span class="sp"></span><button class="btn sm danger" data-act="guestRm" data-arg="${k}">Remove</button></div>
    <div class="tiny dim">${esc(g.note || "")}</div>
    ${x.songs.length ? x.songs.map(y => { const d = guestDoc(g, y.s), inSet = setIds.includes(y.s); return `<div class="gsong"><div class="small"><b>${esc(SONG[y.s] ? SONG[y.s].t : y.s)}</b>${inSet ? "" : " " + chip("Not in set", "red")} <span class="tiny ${d ? "green" : "dim"}">${d ? "Documented: " + esc(d.what) : "Simulated pairing"}</span></div>
      <div class="row tight"><select data-ch="guestPart" data-arg="${k}|${y.s}" aria-label="Part">${Object.entries(GUEST_PARTS).map(([pk, pl]) => opt(pk, pl, y.part)).join("")}</select><select data-ch="guestRole" data-arg="${k}|${y.s}" aria-label="Role">${Object.entries(GUEST_ROLES).map(([rk, rl]) => opt(rk, rl, y.role)).join("")}</select><button class="btn icon" data-act="guestUnsong" data-arg="${k}|${y.s}" title="Remove">✕</button></div></div>`; }).join("") : `<div class="small muted">No songs chosen — they'll join on a suitable encore song.</div>`}
    ${free.length ? `<div class="row tight"><select id="gs-${esc(x.id)}" aria-label="Song for ${esc(g.n)}">${free.map(id => opt(id, SONG[id].t + ((g.songs || []).includes(id) ? " ★" : "") + (guestDoc(g, id) ? " (documented)" : ""), (g.songs || []).find(z => free.includes(z)) || "")).join("")}</select><button class="btn sm" data-act="guestSong" data-arg="${k}">+ Add song</button></div>` : ""}
    <div class="row tight">${x.mode === "surprise" ? `<label class="chk small"><input type="checkbox" data-ch="guestLeakOk" data-arg="${k}" ${x.canLeak ? "checked" : ""}>Word can leak out</label>${x.leaked ? "" : `<button class="btn sm" data-act="guestTease" data-arg="${k}">Tease it now</button>`}<button class="btn sm" data-act="guestMode" data-arg="${k}|announced">Make it announced</button>`
      : `<label class="chk small"><input type="checkbox" data-ch="guestAdv" data-arg="${k}" ${x.advertised ? "checked" : ""}>Advertise (+5% demand; fans will expect them)</label><button class="btn sm" data-act="guestMode" data-arg="${k}|surprise">Keep it a surprise</button>`}</div></div>`;
}
function renderGuestBox(sh) {
  const l = showGuests(sh), conf = confirmedGuests(sh), asked = new Set(l.map(x => x.id));
  const gs = guestsFor(sh).filter(x => !asked.has(x.id));
  return `${l.map(x => renderGuestEntry(sh, x)).join("")}
    ${conf.length < GUEST_MAX && gs.length ? `<div class="row tight"><select id="gi-guest" aria-label="Guest">${gs.map(x => opt(x.id, guestOddsLabel(x, sh), "")).join("")}</select><select id="gi-mode" aria-label="Appearance">${opt("announced", "Announced appearance", "")}${opt("surprise", "Planned surprise", "")}</select></div>
      <div class="row tight"><label class="chk small"><input type="checkbox" id="gi-adv">Advertise</label><label class="chk small" title="Ignore schedules and distance: the guest is treated as available"><input type="checkbox" id="gi-over">Override availability</label><button class="btn sm primary" data-act="invite" data-arg="${sh.id}">Invite</button><button class="btn sm" data-act="nav" data-arg="prep">Add an artist…</button></div>
      <div class="tiny dim">Whether a guest says yes depends on your relationship, distance from home and their schedule — unless you override it. Each show is planned separately; up to ${GUEST_MAX} guests a night. Collaborations marked documented really happened; every other pairing is a simulated scenario.</div>`
    : !gs.length && !l.length ? `<div class="small muted">No guests are available for this date${isHistorical() ? " in this era" : ""}.</div>` : ""}`;
}

/* ---------- setlist workshop: special moments ---------- */
function renderSpecials(sh) {
  if (!sh || sh.played || !VENUE[sh.venueId]) return "";
  const v = VENUE[sh.venueId];
  const albums = albumOptions(sh), covers = coverSuggestions(sh);
  const guestBox = renderGuestBox(sh);
  const albumBox = !fullAlbumAllowed() ? `<div class="small muted">${esc(FULL_ALBUM_ERA_MSG)}</div>`
    : sh.albumSeg ? `<div class="row tight">${chip(albumSegIntact(sh) ? "In the set" : "Broken up", albumSegIntact(sh) ? "green" : "red")}<b>${esc(ALBUMS[sh.albumSeg.al].n)}</b><span class="small muted">${sh.albumSeg.where} of the main set${sh.albumSeg.advertised ? " · advertised" : ""}</span><button class="btn sm" data-act="clearAlbum" data-arg="${sh.id}">Remove</button></div>`
    : `<div class="row tight"><select id="am-album" aria-label="Album">${albums.map(a => opt(a, `${ALBUMS[a].n} (${albumTrackIds(a).length} songs)`, "")).join("")}</select><select id="am-where" aria-label="Position">${opt("early", "Early in the set", "middle")}${opt("middle", "Middle of the set", "middle")}${opt("late", "Late in the main set", "middle")}${opt("opening", "Open the show with it", "middle")}</select><label class="chk small"><input type="checkbox" id="am-adv">Advertise (+8% demand)</label><button class="btn sm primary" data-act="applyAlbum" data-arg="${sh.id}">Add album</button></div>
      <div class="tiny dim">Optional. The album plays front to back in order, and the rest of the set is trimmed around it so the night still feels like a full concert. A first-time album night means more to fans than a repeat.</div>`;
  return `<div class="panel"><div class="panel-h"><h3>Special moments</h3><span class="tag">GUESTS · FULL ALBUM · COVERS</span></div><div class="panel-b stack">
    <div class="stack"><div class="tiny dim mono">SPECIAL GUESTS</div>${guestBox}</div>
    <div><div class="tiny dim mono">FULL-ALBUM PERFORMANCE</div>${albumBox}</div>
    <div><div class="tiny dim mono">COVERS FOR ${esc(CITY[v.city].n.toUpperCase())}</div>${covers.length ? `<div class="row tight">${covers.map(c => `<button class="btn sm" data-act="addSong" data-arg="${c.s.id}:encore" title="${esc(c.why)}">+ ${esc(c.s.t)}${c.local ? " ★" : ""}</button>`).join("")}</div><div class="tiny dim">★ suits this city or region. The band may also slip in a local cover on its own if it knows it well enough.</div>` : `<div class="small muted">No covers available.</div>`}</div>
    <div class="row tight"><span class="small muted">Sound check: ${(sh.sc && sh.sc.songs && sh.sc.songs.length ? sh.sc.songs : autoSoundcheck(sh)).map(id => esc(SONG[id].t)).join(", ")}${sh.sc && sh.sc.songs && sh.sc.songs.length ? "" : " (automatic)"}</span><button class="btn sm" data-act="scGo" data-arg="${sh.id}">Plan sound check</button></div>
  </div></div>`;
}

/* ---------- reports: the show story ---------- */
function renderShowStory(sh) {
  const R = sh && sh.report; if (!R || !R.happy) return "";
  const H = R.happy, sc = R.soundcheck;
  return `<div class="panel"><div class="panel-h"><h3>Fan happiness <span class="tag">GAME ESTIMATE</span></h3><span class="chip ${H.score >= 80 ? "green" : H.score >= 60 ? "amber" : "red"}">${H.score} · ${esc(H.label)}</span></div><div class="panel-b grid g2" style="gap:14px">
    <div class="stack">${H.parts.map(p => `<div class="row tight"><span class="sp small">${esc(p.t)}</span><span class="mono ${p.base ? "" : p.v >= 0 ? "pos" : "neg"}">${p.base ? p.v : sgn(p.v)}</span></div>`).join("")}
      <div class="tiny dim">Most of the crowd is there to see the band; a normal good night rates in the 80s. Extras add to it; only real problems take away.</div></div>
    <div class="stack">
      ${(R.guests || (R.guest ? [Object.assign({ songs: [{ s: R.guest.song }] }, R.guest)] : [])).map(x => `<div><div class="tiny dim mono">${x.surprise ? "SURPRISE GUEST" : "SPECIAL GUEST"}${x.leaked ? " · LEAKED BEFOREHAND" : ""}${x.custom ? " · CUSTOM (FICTIONAL)" : ""}</div><div class="small"><b>${esc(x.n)}</b> on ${(x.songs || []).map(y => `"${esc(SONG[y.s] ? SONG[y.s].t : "—")}"${y.part && y.part !== "full" ? " (" + esc(GUEST_PARTS[y.part].toLowerCase()) + ")" : ""}${y.role ? " · " + esc(GUEST_ROLES[y.role].toLowerCase()) : ""}${y.doc ? " " + chip("Documented pairing", "green") : ""}`).join(", ")}</div></div>`).join("")}
      ${R.guestCancelled ? `<div class="issue">${esc(R.guestCancelled)} couldn't make it.</div>` : ""}
      ${R.album ? `<div><div class="tiny dim mono">FULL ALBUM</div><div class="small">${esc(R.album.n)} — ${R.album.intact ? `played front to back${R.album.nth > 1 ? ` (time ${R.album.nth} this tour)` : " (first time this tour)"}` : "not played as planned"}</div></div>` : ""}
      ${(R.changes || []).length ? `<div><div class="tiny dim mono">ON THE NIGHT</div>${R.changes.map(c => `<div class="small">${c.kind === "swap" ? `"${esc(SONG[c.s].t)}" → "${esc(SONG[c.to].t)}"` : c.kind === "cover" ? `Added "${esc(SONG[c.s].t)}"` : c.kind === "added" ? `Added "${esc(SONG[c.s].t)}"` : `Dropped "${esc(SONG[c.s].t)}"`} <span class="muted">— ${esc(c.why)}</span></div>`).join("")}</div>` : ""}
      ${sc ? `<div><div class="tiny dim mono">SOUND CHECK${sc.auto ? " (AUTOMATIC)" : ""}</div><div class="small">${sc.songs.map(id => esc(SONG[id] ? SONG[id].t : id)).join(", ") || "—"}</div>${sc.issues.map(x => `<div class="issue ${x.found ? "info" : "error"}">${esc(x.text)}</div>`).join("")}${sc.leak ? `<div class="issue">Overheard by ${esc(sc.leak.source)}${sc.leak.partial ? " (only part of it)" : ""}.</div>` : ""}</div>` : ""}
      ${R.rumoured && R.rumoured.length ? `<div class="small">Rumoured beforehand and played: ${R.rumoured.map(id => `"${esc(SONG[id].t)}"`).join(", ")}.</div>` : ""}
    </div></div></div>`;
}

/* ---------- hooks ---------- */
(() => {
  const fr = renderRequests;
  renderRequests = function (sh) { return (sh && !sh.played ? renderSpecials(sh) : "") + fr(sh); };
  const fn = renderShowNotes;
  renderShowNotes = function (sh) { return (sh && sh.played ? renderShowStory(sh) : "") + fn(sh); };
})();
function rehAddIds(ids) { const d = ui.reh.start || nextFreeDay(); ids.forEach(id => { if (SONG[id] && !ui.reh.songs.includes(id) && rehearsalSongAllowed(SONG[id], d)) ui.reh.songs.push(id); }); }
Object.assign(ACT, {
  advWeek: () => { const r = advanceDays(7); persist(); if (typeof r === "string") toast(r, true); else toast(`Advanced ${r.days} day${r.days > 1 ? "s" : ""} to ${fmtD(r.to)}.`); render(); },

function trendMark(d, base) { if (d == null) return ""; const r = base ? d / base : 0; return Math.abs(r) < .02 ? `<span class="dim" title="About the same as the night before">→</span>` : d > 0 ? `<span class="pos" title="More demand than the night before">↑</span>` : `<span class="neg" title="Less demand than the night before">↓</span>`; }

  return `<div class="scroll-x"><table class="data proj-t"><thead><tr><th>Night</th><th>Date</th><th class="n">Expected sales</th><th class="n">Attendance</th><th class="n">Filled</th><th class="n">Left</th><th class="n">Ticket revenue</th><th>Demand</th><th class="n">Sell-out chance</th></tr></thead><tbody>
    ${rows.map((r, i) => { const st = r.st; if (!st) return `<tr><td>${i + 1}</td><td class="small">${r.date ? fmtD(r.date, { year: undefined }) : "—"}</td><td colspan="7" class="small muted">No projection (date not bookable)</td></tr>`;
      const prev = i > 0 && rows[i - 1].st ? rows[i - 1].st.demand : null;
      return `<tr><td>${i + 1} ${prev != null ? trendMark(st.demand - prev, prev) : ""}</td><td class="small nowrap">${fmtD(r.date, { year: undefined })} <span class="muted">${st.dow.slice(0, 3)}</span></td>
        <td class="n">${num(st.sold)}<div class="tiny dim">${st.lo === st.hi ? "" : num(st.lo) + "–" + num(st.hi)}</div></td><td class="n">${num(st.att)}</td><td class="n">${pct(st.fill)}<div class="tiny dim">of ${num(st.cap)}</div></td><td class="n">${num(st.remaining)}</td><td class="n">${money(st.ticketRev)}</td>
        <td>${levelChip(st.level)}</td><td class="n">${pct(st.sellP)}</td></tr>`; }).join("")}
    ${ok.length > 1 ? `<tr class="tot"><td colspan="2"><b>All ${ok.length} nights</b></td><td class="n"><b>${num(T.sold)}</b></td><td class="n"><b>${num(T.att)}</b></td><td class="n"><b>${pct(T.cap ? T.sold / T.cap : 0)}</b><div class="tiny dim">of ${num(T.cap)}</div></td><td class="n">${num(T.cap - T.sold)}</td><td class="n"><b>${money(T.ticketRev)}</b></td><td colspan="2" class="small muted">≈${(T.demand / (ok[0].st.demand || 1)).toFixed(2)}× one night's demand</td></tr>` : ""}

}

  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { drag = null; } };

    if (!best) { if (st.sel || st.cl) { st.sel = null; st.cl = null; tmRefreshPanel(id); tmDraw(id); } return; }
    if (best.kind === "c") { st.cl = best.ids; st.sel = null; st._clAt = p; } else { st.sel = best.id; st.cl = null; if (id === "planner") { ui.plan.city = VENUE[best.id].city; const vl = $("#venue-list"); if (vl) vl.innerHTML = renderVenueList(); } }

    else if (e.key === "ArrowLeft") { st.cx -= d; tmDraw(id); } else if (e.key === "ArrowRight") { st.cx += d; tmDraw(id); } else if (e.key === "ArrowUp") { st.cy += d; tmDraw(id); } else if (e.key === "ArrowDown") { st.cy -= d; tmDraw(id); }

    h = h.replace(`<div class="dropzone" data-drop-end="1">Drop here to add at the end</div>`, `<button type="button" class="ins last" data-act="pickOpen" data-arg="insert:${n}">+ Add song at the end</button><div class="dropzone" data-drop-end="1">Drop here to add at the end</div>`);
    ui.flash = null;
    return `<div class="row tight run-tools"><button class="btn sm" id="undo-btn" data-act="undo" ${ui.undo.some(u => u.shId === sh.id) ? "" : "disabled"} title="Ctrl/⌘+Z">↶ Undo${ui.undo.length && ui.undo[ui.undo.length - 1].shId === sh.id ? ": " + esc(ui.undo[ui.undo.length - 1].label) : ""}</button><span class="tiny dim">Drag ⋮⋮ to reorder (including into the encore), ⇄ to replace, ⋯ for more.</span></div>` + h;
  };
})();
Object.assign(ACT, {
  pickOpen: a => { const [m, i] = a.split(":"); openPicker(m, +i); },
  pickClose: () => { ui.pick = null; closeModal(); },
  pickKind: k => { ui.pick.kind = k; refreshPicker(true); },
  pickReplace: id => replaceSong(id),
  pickInsertOne: id => insertSongs([id]),
  pickInsertSel: () => insertSongs(ui.pick.sel.slice()),
  songMenu: i => { ui.menu = ui.menu === +i ? null : +i; const r = $("#run-list"); if (r) r.innerHTML = renderRun(currentShow()); },
  secMove: a => { const [i, k] = a.split(":"); moveToSection(+i, k); },
  dupSong: i => dupSong(+i),
  arrPick: a => { const [i, k] = a.split(":"), sh = currentShow(), before = setSnap(sh); const e = setArrangement(sh.id, +i, k); ui.menu = null; if (e) { toast(e, true); render(); return; } pushUndo(sh, before, "change arrangement"); persist(); render(); },
  undo: () => undoLast()
});
Object.assign(CH, {
  pickSel: (v, id, t) => { const s = ui.pick.sel; if (t.checked) { if (!s.includes(id)) s.push(id); } else ui.pick.sel = s.filter(x => x !== id); refreshPicker(true); },
  pickArr: v => { ui.pick.arr = v; },
  pickKeepGuest: (v, a, t) => { ui.pick.keepGuest = t.checked; }
});
Object.assign(INP, { pickQ: v => { ui.pick.q = v; refreshPicker(false); } });
/* closing the picker any other way (Esc, clicking outside) leaves the setlist unchanged */
(() => { const f = closeModal; closeModal = function () { if (ui.pick && $("#pick-root")) ui.pick = null; f(); }; })();
/* menu actions close the menu; rmSong/mvSong already re-render */
(() => { ["rmSong", "mvSong"].forEach(k => { const f = ACT[k]; ACT[k] = (a, t, e) => { ui.menu = null; f(a, t, e); }; }); })();

/* =====================================================================
   TEMPLATE LIBRARY (Setlist Workshop) — historical opening-night setlists
   from setlist.fm, leg openers, imported concerts and the player's own
   templates. Preview, apply (replace / append / insert), save a copy,
   import another concert by URL + pasted song list.
   ===================================================================== */
ui.tpl = ui.tpl || { view: "list", id: null, filter: "era", mode: "replace", at: 0, addMissing: false, imp: null };
const TPL_STATUS_CHIP = { complete: ["Verified — complete", "green"], incomplete: ["Verified — incomplete", "amber"], unsourced: ["Not yet sourced", ""], failed: ["Import failed", "red"], custom: ["Your template", "blue"] };
function tplChip(st) { const c = TPL_STATUS_CHIP[st] || [st, ""]; return chip(c[0], c[1]); }
function tplSecLabel(sec) { return { main: "Main set", acoustic: "Acoustic / pre-show set", encore: "Encore", encore2: "Encore 2" }[sec] || sec; }

/* (sh) → the workshop's tool row gets a Templates button; a concert built from a template says so */
(() => {
  const f = setlistTools;
  setlistTools = function (sh) {
    const h = f(sh);
    const ft = sh.fromTemplate ? `<div class="tiny muted tpl-origin">Started from template <b>${esc(sh.fromTemplate.name)}</b>${sh.fromTemplate.url ? ` · <a href="${esc(sh.fromTemplate.url)}" target="_blank" rel="noopener">setlist.fm source ↗</a>` : ""} — editing this concert doesn't change the template.</div>` : "";
    return h.replace(`<button class="btn sm" data-act="importSet"`, `<button class="btn sm" data-act="tplOpen" ${sh.played ? "disabled" : ""}>Templates…</button><button class="btn sm" data-act="importSet"`) + ft;
  };
})();

function tplListHTML() {
  const T = ui.tpl, era = currentEra().id, gen = generatedTemplates(), cust = tplState().custom;
  const rows = (T.filter === "era" ? gen.filter(t => t.era === era) : T.filter === "all" ? gen : []).concat(T.filter === "mine" || T.filter === "era" ? cust.filter(t => T.filter === "mine" || t.era === era) : T.filter === "all" ? cust : []);
  const tourRows = ERA_ORDER.map(id => ({ id, st: tourTemplateStatus(id) }));
  const done = tourRows.filter(x => x.st === "complete" || x.st === "incomplete").length;
  return `<div class="modal-h"><div><div class="k">Setlist Workshop</div><h2>Template library</h2></div><button class="btn ghost" data-act="tplClose" aria-label="Close">✕</button></div>
  <div class="modal-b stack">
    <div class="small muted">Opening-night setlists of each historical tour, taken from <b>setlist.fm</b> (songs, order, encores, covers and guests as recorded there), plus leg openers, concerts you import and your own templates. Applying a template copies its songs into a concert — the template and its source never change.</div>
    <div class="tiny dim">Historical tours with an opening-night template: <b>${done} of ${tourRows.length}</b>${done < tourRows.length ? " — tours without one show “Not yet sourced”." : "."}</div>
    <div class="row tight"><div class="seg">${[["era", isHistorical() ? "This tour" : "Fictional tour"], ["all", "All historical tours"], ["mine", "Your templates"]].map(([k, l]) => `<button class="${T.filter === k ? "on" : ""}" data-act="tplFilter" data-arg="${k}">${l}</button>`).join("")}</div><span class="sp"></span><button class="btn sm" data-act="tplImportOpen">Import a concert from setlist.fm…</button></div>
    <div class="tpl-list">${rows.length ? rows.map(t => `<div class="tpl-row">
        <div class="tpl-main"><b>${esc(t.name)}</b>
          <div class="tiny muted">${t.kind === "custom" ? `Saved ${fmtD(t.created)} · ${t.songs.length} songs${t.basedOn ? " · based on " + esc((templateById(t.basedOn) || { name: "a template" }).name) : ""}` : `${fmtD(t.date)} · ${esc(t.venue)}, ${esc(t.city)} · ${t.songs.length} songs${t.unmatched.length ? ` (${t.unmatched.length} not in the library)` : ""}${t.legOpener ? " · leg opener: " + esc(t.leg) : ""}${t.imported ? " · imported by you" : ""}`}</div></div>
        <div class="row tight">${tplChip(t.kind === "custom" ? "custom" : t.status)}${t.url ? `<a class="btn sm ghost" href="${esc(t.url)}" target="_blank" rel="noopener" title="Open the concert on setlist.fm">setlist.fm ↗</a>` : ""}<button class="btn sm primary" data-act="tplPreview" data-arg="${t.id}">Preview</button></div></div>`).join("")
      : `<div class="empty small">${T.filter === "mine" ? "No templates yet. Open a concert's setlist, then use “Save as template” in the preview of any template, or the button below." : isHistorical() ? "No template for this tour yet — import one from setlist.fm." : "Historical templates belong to the historical tours. Switch to “All historical tours” to browse them, or save your own."}</div>`}</div>
    ${T.filter === "all" ? `<div class="tiny dim">${tourRows.map(x => `${esc(ERAS[x.id].n)}: ${(TPL_STATUS_CHIP[x.st] || [x.st])[0]}`).join(" · ")}</div>` : ""}
  </div>
  <div class="modal-f"><button class="btn" data-act="tplSaveCurrent">Save this concert's setlist as a template…</button><span class="sp"></span><button class="btn" data-act="tplClose">Close</button></div>`;
}
function tplPreviewHTML() {
  const T = ui.tpl, t = templateById(T.id), sh = currentShow();
  if (!t) return tplListHTML();
  const n = sh ? sh.setlist.length : 0;
  let cur = null, k = 0;
  const list = t.songs.map(x => {
    const s = SONG[x.s], ok = s && (!sh || songAllowedFor(s, sh));
    const head = x.sec !== cur ? (cur = x.sec, `<div class="tpl-sec">${esc(x.srcSec || tplSecLabel(x.sec))}</div>`) : "";
    k++;
    return `${head}<div class="tpl-song ${ok ? "" : "off"}"><span class="mono tiny dim">${k}</span><span><b>${esc(s ? s.t : x.title)}</b>${x.note ? ` <span class="tiny muted">— ${esc(x.note)}</span>` : ""}${x.title && s && normTitle(x.title) !== normTitle(s.t) && !x.seg ? ` <span class="tiny dim">(recorded as “${esc(x.title)}”)</span>` : ""}${!ok && s && sh ? ` <span class="tiny amber">${esc(songNotYetMsg(s, sh.date))}</span>` : ""}</span></div>`;
  }).join("");
  const um = (t.unmatched || []).map(u => `<div class="tpl-song off"><span class="mono tiny dim">#${u.n}</span><span><b>${esc(u.title)}</b> <span class="tiny amber">not in the game's song library</span>${u.note ? ` <span class="tiny muted">— ${esc(u.note)}</span>` : ""}</span></div>`).join("");
  const ex = (t.excluded || []).map(u => `<div class="tpl-song off"><span class="mono tiny dim">#${u.n}</span><span>${esc(u.title)} <span class="tiny dim">— in the source, left out of the template (${esc(u.why)})</span></span></div>`).join("");
  const meta = t.kind === "custom" ? `<div class="tpl-meta"><div><span>Template</span><b>${esc(t.name)}</b></div><div><span>Type</span><b>Your template (a copy — editing concerts never changes it)</b></div><div><span>Songs</span><b>${t.songs.length}</b></div><div><span>Saved</span><b>${fmtD(t.created)}</b></div></div>`
    : `<div class="tpl-meta"><div><span>Template</span><b>${esc(t.name)}</b></div><div><span>Historical tour</span><b>${esc((ERAS[t.era] || {}).n || t.tour)}</b></div>
      <div><span>Source concert</span><b>${fmtD(t.date)} · ${esc(t.venue)}, ${esc(t.city)}</b></div><div><span>Designation</span><b>${t.legOpener ? "Opening night of a leg — " + esc(t.leg) + " (not the tour opener)" : t.imported ? "Imported concert" + (t.leg ? " — " + esc(t.leg) : "") : "Opening night of the tour"}${t.tour ? ` · setlist.fm tour name: “${esc(t.tour)}”` : ""}</b></div>
      <div><span>Songs</span><b>${t.songs.length} in the template · ${t.sourceCount} rows in the source</b></div><div><span>Source</span><b><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.url.replace(/^https:\/\/www\./, ""))}</a></b></div>
      <div><span>Retrieved</span><b>${fmtD(t.retrieved)}</b></div><div><span>Verification</span><b>${tplChip(t.status)}</b></div></div>
      ${t.sourceNote ? `<div class="tiny muted">${esc(t.sourceNote)}</div>` : ""}`;
  const can = sh && editable(sh);
  return `<div class="modal-h"><div><div class="k"><button class="btn ghost sm" data-act="tplBack">← Library</button></div><h2>${esc(t.name)}</h2></div><button class="btn ghost" data-act="tplClose" aria-label="Close">✕</button></div>
  <div class="modal-b stack">${meta}
    <div class="tpl-songs">${list}${um}${ex}</div>
    ${t.unmatched && t.unmatched.length ? `<label class="chk small"><input type="checkbox" data-ch="tplAddMissing" ${T.addMissing ? "checked" : ""}> Add the ${t.unmatched.length} missing song${t.unmatched.length > 1 ? "s" : ""} to your song library as custom songs (titles as recorded; length, energy and familiarity are game defaults)</label>` : ""}
  </div>
  <div class="modal-f">${can ? `<label class="small muted">Apply to ${esc(showName(sh))}, ${fmtD(sh.date, { year: undefined })} <select data-ch="tplMode">${opt("replace", "Replace the setlist", T.mode)}${opt("append", "Add to the end", T.mode)}${n ? opt("insert", "Insert at…", T.mode) : ""}</select></label>
      ${T.mode === "insert" && n ? `<select data-ch="tplAt" aria-label="Insert before">${sh.setlist.map((e, i) => opt(i, "before #" + (i + 1) + " " + (SONG[e.s] ? SONG[e.s].t : ""), T.at)).join("")}${opt(n, "at the end", T.at)}</select>` : ""}
      <button class="btn primary" data-act="tplApply">${T.mode === "replace" && n ? "Replace " + n + " songs" : "Apply"}</button>` : `<span class="small muted">${sh ? lockedMsg(sh) : "Choose a concert in the workshop to apply this template."}</span>`}
    <span class="sp"></span>${t.kind === "custom" ? `<button class="btn danger" data-act="tplDelete" data-arg="${t.id}">Delete template</button>` : t.imported ? `<button class="btn danger" data-act="tplRemoveImport" data-arg="${t.id}">Remove import</button>` : ""}<button class="btn" data-act="tplCopy" data-arg="${t.id}">Save a copy as my template</button></div>`;
}
function tplImportHTML() {
  const I = ui.tpl.imp || (ui.tpl.imp = { url: "", date: "", venue: "", city: "", leg: "", text: "", partial: false, era: currentEra().id, err: "" });
  return `<div class="modal-h"><div><div class="k"><button class="btn ghost sm" data-act="tplBack">← Library</button></div><h2>Import a concert from setlist.fm</h2></div><button class="btn ghost" data-act="tplClose" aria-label="Close">✕</button></div>
  <div class="modal-b stack">
    <div class="notice small">This game runs entirely in your browser, so it can't read setlist.fm by itself: setlist.fm's API needs a personal API key and a server, and its pages can't be fetched from another site. To use another concert (for example a later night of the same tour, or a leg opener), open its page on setlist.fm, copy the song list, and paste it here with the page address. The game checks the address and matches every title to its song library; nothing is filled in.</div>
    <div class="form-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <label class="f" style="grid-column:1/-1"><span>setlist.fm page address</span><input type="url" id="imp-url" placeholder="https://www.setlist.fm/setlist/bruce-springsteen/1984/…html" value="${esc(I.url)}"></label>
      <label class="f"><span>Concert date</span><input type="date" id="imp-date" value="${esc(I.date)}"></label>
      <label class="f"><span>Historical tour</span><select id="imp-era">${ERA_ORDER.map(id => opt(id, ERAS[id].n + " (" + ERAS[id].years + ")", I.era)).join("")}</select></label>
      <label class="f"><span>Venue</span><input type="text" id="imp-venue" value="${esc(I.venue)}" maxlength="80"></label>
      <label class="f"><span>City</span><input type="text" id="imp-city" value="${esc(I.city)}" maxlength="80"></label>
      <label class="f" style="grid-column:1/-1"><span>Leg (optional, e.g. “Europe 2023”) — only if this concert opened a leg</span><input type="text" id="imp-leg" value="${esc(I.leg)}" maxlength="60"></label>
      <label class="f" style="grid-column:1/-1"><span>Song list, one song per line, in order. Section lines such as “Encore:” are kept; notes in brackets after a title are kept as annotations.</span><textarea id="imp-text" rows="10" placeholder="Badlands&#10;Night&#10;…&#10;Encore:&#10;Born to Run">${esc(I.text)}</textarea></label>
      <label class="chk small" style="grid-column:1/-1"><input type="checkbox" id="imp-partial" ${I.partial ? "checked" : ""}> setlist.fm marks this setlist as incomplete / partial</label>
    </div>
    ${I.err ? `<div class="issue">${esc(I.err)}</div>` : ""}
  </div>
  <div class="modal-f"><span class="sp"></span><button class="btn" data-act="tplBack">Cancel</button><button class="btn primary" data-act="tplImportDo">Check and import</button></div>`;
}
function tplRender() {
  const T = ui.tpl, body = T.view === "preview" ? tplPreviewHTML() : T.view === "import" ? tplImportHTML() : tplListHTML();
  const r = $("#tpl-root"); if (r) r.innerHTML = body; else openModal(`<div id="tpl-root">${body}</div>`, true);
}
function tplReadImport() {
  const I = ui.tpl.imp, v = id => { const e = $("#" + id); return e ? (e.type === "checkbox" ? e.checked : e.value) : ""; };
  Object.assign(I, { url: v("imp-url"), date: v("imp-date"), era: v("imp-era"), venue: v("imp-venue"), city: v("imp-city"), leg: v("imp-leg"), text: v("imp-text"), partial: v("imp-partial") });
}
Object.assign(ACT, {
  tplOpen: () => { const sh = currentShow(); ui.tpl.view = "list"; ui.tpl.filter = isHistorical() ? "era" : "all"; ui.tpl.at = sh ? sh.setlist.length : 0; tplRender(); },
  tplClose: () => { closeModal(); },
  tplFilter: k => { ui.tpl.filter = k; tplRender(); },
  tplPreview: id => { ui.tpl.view = "preview"; ui.tpl.id = id; ui.tpl.addMissing = false; const sh = currentShow(); ui.tpl.mode = sh && sh.setlist.length ? ui.tpl.mode : "replace"; tplRender(); },
  tplBack: () => { if (ui.tpl.view === "import") tplReadImport(); ui.tpl.view = "list"; tplRender(); },
  tplImportOpen: () => { ui.tpl.view = "import"; tplRender(); },
  tplImportDo: () => {
    tplReadImport(); const I = ui.tpl.imp, r = importSetlistFm(I);
    if (r.error) { I.err = r.error; tplRender(); return; }
    ui.tpl.imp = null; persist(); ui.tpl.view = "preview"; ui.tpl.id = r.template.id;
    toast(`Imported ${r.template.songs.length} songs${r.template.unmatched.length ? `; ${r.template.unmatched.length} title${r.template.unmatched.length > 1 ? "s" : ""} not in the library` : ""}.`); tplRender();
  },
  tplApply: () => {
    const sh = currentShow(), T = ui.tpl; if (!sh || !editable(sh)) return;
    const before = setSnap(sh), r = applyTemplate(T.id, sh.id, T.mode, T.at, { addMissing: T.addMissing });
    if (r.error) { toast(r.error, true); return; }
    pushUndo(sh, before, "apply template"); persist(); closeModal(); render();
    toast(`${r.added} song${r.added === 1 ? "" : "s"} from the template${r.created.length ? `; ${r.created.length} added to your library` : ""}${r.skipped.length ? `; ${r.skipped.length} skipped (${r.skipped.slice(0, 3).map(x => x.title).join(", ")}${r.skipped.length > 3 ? "…" : ""})` : ""}.`);
  },
  tplCopy: id => {
    const t = templateById(id); if (!t) return;
    const nm = (t.kind === "custom" ? t.name + " (copy)" : t.name.replace(" — ", " — my version of ")).slice(0, 80);
    const st = tplState(); if (st.custom.some(x => x.name === nm)) { toast(`"${nm}" already exists.`, true); return; }
    st.custom.push({ id: "ctpl-" + uid(), kind: "custom", name: nm, era: t.era || currentEra().id, created: S.today, basedOn: t.id, status: "custom", songs: t.songs.map(x => ({ s: x.s, sec: x.sec, title: x.title, arr: x.arr })), unmatched: [] });
    touch(); persist(); ui.tpl.view = "list"; ui.tpl.filter = "mine"; tplRender(); toast("Saved as your template — the original stays as it was.");
  },
  tplSaveCurrent: () => {
    const sh = currentShow(); if (!sh) return;
    const nm = `${showName(sh)} ${fmtD(sh.date, { year: undefined })}`;
    const e = saveCustomTemplate(sh.id, nm + (tplState().custom.some(t => t.name === nm) ? " (" + (tplState().custom.length + 1) + ")" : ""));
    if (e) { toast(e, true); return; } persist(); ui.tpl.view = "list"; ui.tpl.filter = "mine"; tplRender(); toast("Saved this concert's setlist as a template.");
  },
  tplDelete: id => { const e = deleteCustomTemplate(id); if (e) { toast(e, true); return; } persist(); ui.tpl.view = "list"; tplRender(); },
  tplRemoveImport: id => { removeImportedSource(id); persist(); ui.tpl.view = "list"; tplRender(); }
});
Object.assign(CH, {
  tplMode: v => { ui.tpl.mode = v; tplRender(); },
  tplAt: v => { ui.tpl.at = +v; },
  tplAddMissing: (v, a, t) => { ui.tpl.addMissing = t.checked; }
});

/* Starts the game once every module above has loaded. */
if (typeof document !== "undefined" && document.getElementById("app")) boot();

</script>
